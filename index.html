<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Vocab A4 Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Library Ringan untuk Auto-Pinyin -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js"></script>

  <style>
    :root {
      --bg-cream: #fcf9f2;
      --card-bg: #fffdfa;
      --chinese-red: #1e8b8b;
      --deep-crimson: #5c0f12;
      --gold: #d4a359;
      --gold-dark: #aa7a30;
      --pinyin-color: #b82828;
      --meaning-color: #226f16;
      --grid-line: #f1cfc6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1e24;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    /* Panel Input & Kawalan */
    .control-panel {
      width: 210mm;
      max-width: 100%;
      background: #252b33;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: #fff;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .panel-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold);
    }

    .stats {
      font-size: 0.82rem;
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .form-grid {
        display: grid;
        grid-template-columns: 1.5fr 1.5fr 2fr auto;
        gap: 10px;
      }
    }

    .input-field {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #3d4653;
      background: #171b21;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--gold);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1.5fr 1.5fr 1fr;
      gap: 8px;
    }

    button {
      padding: 12px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-add { background: var(--gold); color: #2b2321; }
    .btn-add:hover { background: #e2b166; }
    .btn-print { background: #c93434; color: #fff; }
    .btn-print:hover { background: #e04343; }
    .btn-clear { background: transparent; color: #aaa; border: 1px solid #444; }
    .btn-clear:hover { background: #333; color: #fff; }

    /* Pembungkus Pratonton untuk Skrin Telefon */
    .preview-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding-bottom: 24px;
    }

    /* Halaman A4 */
    .a4-page {
      width: 210mm;
      min-width: 210mm;
      height: 297mm;
      background-color: var(--bg-cream);
      padding: 8mm;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: radial-gradient(#ecd5b5 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }

    .outer-border {
      width: 100%;
      height: 100%;
      border: 2px solid var(--chinese-red);
      padding: 4mm;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .corner-motif {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 2.5px solid var(--chinese-red);
    }
    .c-top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .c-top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .c-bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .c-bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Grid 16 Kotak (4x4) */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 3.5mm;
      width: 100%;
      height: 100%;
    }

    /* Kad Vocab */
    .vocab-card {
      background: var(--card-bg);
      border: 1.5px solid var(--chinese-red);
      border-radius: 6px;
      padding: 8px 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 3px rgba(139, 30, 30, 0.08);
      overflow: hidden;
      text-align: center;
    }

    .card-decor-corner {
      position: absolute;
      width: 6px;
      height: 6px;
      border-color: var(--gold-dark);
      border-style: solid;
      opacity: 0.8;
      pointer-events: none;
    }
    .dc-tl { top: 3px; left: 3px; border-width: 1px 0 0 1px; }
    .dc-tr { top: 3px; right: 3px; border-width: 1px 1px 0 0; }
    .dc-bl { bottom: 3px; left: 3px; border-width: 0 0 1px 1px; }
    .dc-br { bottom: 3px; right: 3px; border-width: 0 1px 1px 0; }

    .badge-icon {
      position: absolute;
      right: 5px;
      top: 4px;
      font-size: 0.85rem;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Kotak Hanzi Dinamik */
    .mizige-container {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
      flex-wrap: nowrap;
    }

    .mizige-box {
      width: 36px;
      height: 36px;
      border: 1px solid var(--chinese-red);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      flex-shrink: 0;
    }

    .mizige-box::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-top: 1px dashed var(--grid-line);
      border-left: 1px dashed var(--grid-line);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .mizige-box::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(to top right, transparent calc(50% - 0.5px), var(--grid-line) 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), var(--grid-line) 50%, transparent calc(50% + 0.5px));
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .hanzi-char {
      position: relative;
      z-index: 2;
      font-family: 'Noto Serif SC', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--deep-crimson);
      line-height: 1;
    }

    .vocab-details {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 2px;
    }

    .pinyin-text {
      color: var(--pinyin-color);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .meaning-text {
      color: var(--meaning-color);
      font-size: 0.76rem;
      font-weight: 500;
      line-height: 1.25;
      min-height: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      padding: 0 4px;
    }

    /* Cetakan A4 */
    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .control-panel {
        display: none !important;
      }
      .preview-wrapper {
        padding: 0;
        overflow: visible;
      }
      .a4-page {
        box-shadow: none;
        margin: 0;
        page-break-after: avoid;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Panel Borang Input -->
  <div class="control-panel">
    <div class="panel-header">
      <h2>Sistem Kosa Kata Bahasa Cina</h2>
      <div class="stats" id="counter">0 / 16 perkataan</div>
    </div>
    <form id="vocabForm" class="form-grid">
      <!-- Input Hanzi: lang="zh-CN" mengaktifkan keyboard Mandarin Gboard -->
      <input 
        type="text" 
        id="hanziInput" 
        class="input-field" 
        placeholder="Hanzi (cth: 习惯)" 
        lang="zh-CN" 
        autocorrect="off" 
        autocomplete="off" 
        required 
      />
      <!-- Input Pinyin: diisi automatik, masih boleh disunting manual -->
      <input 
        type="text" 
        id="pinyinInput" 
        class="input-field" 
        placeholder="Pinyin (Auto)" 
        lang="zh-Latn" 
        required 
      />
      <!-- Input Maksud: lang="en" mengaktifkan keyboard English Gboard -->
      <input 
        type="text" 
        id="meaningInput" 
        class="input-field" 
        placeholder="Maksud (English / Malay)" 
        lang="en" 
        inputmode="text" 
        autocapitalize="sentences" 
        required 
      />
      <div class="btn-group">
        <button type="submit" class="btn-add">+ Masuk</button>
        <button type="button" class="btn-print" onclick="window.print()">Cetak / PDF</button>
        <button type="button" class="btn-clear" onclick="clearAllVocab()">Reset</button>
      </div>
    </form>
  </div>

  <!-- Pembungkus Pratonton A4 -->
  <div class="preview-wrapper">
    <div class="a4-page">
      <div class="outer-border">
        <div class="corner-motif c-top-left"></div>
        <div class="corner-motif c-top-right"></div>
        <div class="corner-motif c-bottom-left"></div>
        <div class="corner-motif c-bottom-right"></div>

        <div class="vocab-grid" id="gridContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const traditionalIcons = ['🏮', '🎋', '🪭', '🌸', '🐉', '🧧', '🍵', '🐼', '🏮', '🎋', '🪭', '🌸', '🐉', '🧧', '🍵', '🐼'];
    const TOTAL_SLOTS = 16;
    let vocabList = JSON.parse(localStorage.getItem('chineseVocabList')) || [];

    const hanziInput = document.getElementById('hanziInput');
    const pinyinInput = document.getElementById('pinyinInput');

    // AUTO-PINYIN: Setiap kali Hanzi ditaip / dipilih daripada keyboard
    hanziInput.addEventListener('input', function() {
      const text = this.value.trim();
      if (text && typeof pinyinPro !== 'undefined') {
        // Tukar aksara Cina kepada pinyin lengkap dengan tanda nada
        const generatedPinyin = pinyinPro.pinyin(text);
        pinyinInput.value = generatedPinyin;
      } else if (!text) {
        pinyinInput.value = '';
      }
    });

    function renderSheet() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const item = vocabList[i] || null;
        const card = document.createElement('div');
        card.className = 'vocab-card';

        card.innerHTML = `
          <div class="card-decor-corner dc-tl"></div>
          <div class="card-decor-corner dc-tr"></div>
          <div class="card-decor-corner dc-bl"></div>
          <div class="card-decor-corner dc-br"></div>
          <span class="badge-icon">${traditionalIcons[i]}</span>
        `;

        // Kotak Hanzi Dinamik Mengikut Jumlah Huruf
        const mizigeContainer = document.createElement('div');
        mizigeContainer.className = 'mizige-container';

        if (item && item.hanzi) {
          const chars = item.hanzi.trim().split('');
          chars.forEach(char => {
            const box = document.createElement('div');
            box.className = 'mizige-box';
            box.innerHTML = `<span class="hanzi-char">${char}</span>`;
            mizigeContainer.appendChild(box);
          });
        } else {
          // Placeholder 2 kotak kosong jika belum ada perkataan
          for (let j = 0; j < 2; j++) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'mizige-box';
            mizigeContainer.appendChild(emptyBox);
          }
        }

        // Bahagian Pinyin & Maksud
        const details = document.createElement('div');
        details.className = 'vocab-details';
        details.innerHTML = `
          <div class="pinyin-text">${item ? item.pinyin : ''}</div>
          <div class="meaning-text">${item ? item.meaning : ''}</div>
        `;

        card.appendChild(mizigeContainer);
        card.appendChild(details);
        container.appendChild(card);
      }

      document.getElementById('counter').innerText = `${vocabList.length} / ${TOTAL_SLOTS} perkataan dimuatkan`;
    }

    document.getElementById('vocabForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (vocabList.length >= TOTAL_SLOTS) {
        alert('Grid telah penuh (16 perkataan). Sila cetak atau klik "Reset" untuk set baharu.');
        return;
      }

      const hanzi = hanziInput.value.trim();
      const pinyin = pinyinInput.value.trim();
      const meaning = document.getElementById('meaningInput').value.trim();

      vocabList.push({ hanzi, pinyin, meaning });
      localStorage.setItem('chineseVocabList', JSON.stringify(vocabList));

      renderSheet();

      hanziInput.value = '';
      pinyinInput.value = '';
      document.getElementById('meaningInput').value = '';
      hanziInput.focus();
    });

    function clearAllVocab() {
      if (confirm('Padam semua rekod kosa kata ini?')) {
        vocabList = [];
        localStorage.removeItem('chineseVocabList');
        renderSheet();
      }
    }

    // Paparkan semasa mula-mula muat halaman
    renderSheet();
  </script>
</body>
</html>
